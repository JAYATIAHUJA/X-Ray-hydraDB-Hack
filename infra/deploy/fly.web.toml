# fly launch --no-deploy --copy-config --config infra/deploy/fly.web.toml --name xray-web
# fly deploy --config infra/deploy/fly.web.toml --dockerfile apps/web/Dockerfile
app = "xray-web"
primary_region = "sin"

[build]
  dockerfile = "../../apps/web/Dockerfile"

[env]
  PORT = "8080"
  # Fly private networking: the API app is reachable at <app>.internal
  API_UPSTREAM = "http://xray-api.internal:8000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

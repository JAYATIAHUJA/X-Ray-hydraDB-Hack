name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: apps/api/src:packages/xray_analytics/src:packages/xray_core/src:packages/xray_hydra/src:packages/xray_ingest/src:packages/xray_runtime/src

jobs:
  python:
    name: python (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check apps packages scripts tests
      - name: Ruff format check
        run: uv run ruff format --check apps packages scripts tests
      - name: mypy (strict)
        run: uv run mypy
      - name: Contract + route tests (integration tests need a live HydraDB and are opt-in)
        run: uv run pytest -q
      - name: Synthetic evaluation reproduces the README table
        run: uv run python scripts/eval_synth.py

  web:
    name: web (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-contract:
    name: compose contract (pinned image · RUST_MIN_STACK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q tests/infra

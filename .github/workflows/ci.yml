name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: apps/api/src:packages/xray_analytics/src:packages/xray_core/src:packages/xray_hydra/src:packages/xray_ingest/src:packages/xray_runtime/src

jobs:
  python:
    name: python (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check apps packages scripts tests
      - name: Ruff format check
        run: uv run ruff format --check apps packages scripts tests
      - name: mypy (strict)
        run: uv run mypy
      - name: Contract + route tests (integration tests need a live HydraDB and are opt-in)
        run: uv run pytest -q
      - name: Synthetic evaluation reproduces the README table
        run: uv run python scripts/eval_synth.py

  web:
    name: web (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose-contract:
    name: compose contract (pinned image · RUST_MIN_STACK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest -q tests/infra

  live-hydradb:
    name: HydraDB live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Start pinned HydraDB runtime
        run: >-
          uv run python -m xray_runtime.manager start
          --runtime-id ci-hydra
          --compose-project xray-ci-hydra
      - name: Wait for HydraDB and indexer readiness
        run: >-
          uv run python scripts/wait_healthy.py
          --admin-url http://127.0.0.1:19090
          --indexer-admin-url http://127.0.0.1:19091
          --timeout-seconds 180
      - name: Exercise Bolt writes and path algorithms
        run: |
          export XRAY_HYDRA_URI=bolt://127.0.0.1:17687
          export XRAY_HYDRA_USER=neo4j
          export XRAY_HYDRA_PASSWORD="$(tr -d '\r\n' < infra/runtime/ci-hydra/hydra-auth-token)"
          uv run pytest -q -m integration tests/integration/test_hydradb_live.py
      - name: Show service logs on failure
        if: failure()
        run: >-
          docker compose
          --env-file infra/runtime/ci-hydra/compose.env
          -p xray-ci-hydra
          -f compose.yaml
          -f compose.test.yaml
          logs --no-color --tail 200
      - name: Stop HydraDB runtime
        if: always()
        run: |
          if [ -f infra/runtime/ci-hydra/runtime-manifest.json ]; then
            uv run python -m xray_runtime.manager stop --runtime-id ci-hydra --remove-volumes --purge-local
          fi

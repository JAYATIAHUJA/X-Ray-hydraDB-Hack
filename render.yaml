# X-Ray Evidence Platform — Render Blueprint (Docker, free tier)
# Repo: https://github.com/JAYATIAHUJA/X-Ray-hydraDB-Hack (branch main)
#
# Both services are free. Web reaches API over the public HTTPS URL
# (free instances cannot receive private-network traffic).
# After first deploy, confirm API_UPSTREAM matches the live API hostname.

services:
  - type: web
    name: xray-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/JAYATIAHUJA/X-Ray-hydraDB-Hack
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "10000"
      - key: XRAY_SNAPSHOT_DIR
        value: /app/data/snapshots/kubernetes-demo
      - key: XRAY_READ_ONLY
        value: "true"

  - type: web
    name: xray-web
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/JAYATIAHUJA/X-Ray-hydraDB-Hack
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      # Public URL — update if Render assigns a suffix (xray-api-xxxx.onrender.com)
      - key: API_UPSTREAM
        value: https://xray-api-a0lg.onrender.com

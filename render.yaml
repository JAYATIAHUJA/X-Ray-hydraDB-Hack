# X-Ray Evidence Platform — Render Blueprint (Docker)
# Repo: https://github.com/JAYATIAHUJA/X-Ray-hydraDB-Hack (branch main)
#
# Deploy: Dashboard → New → Blueprint → connect this repo, or:
#   render blueprints validate && (after `render login`) apply via Dashboard.
#
# Networking notes:
# - API must be a paid plan (starter+) so web can reach it on the private network.
# - Free web services can *send* private traffic but cannot *receive* it.
# - API_UPSTREAM uses the Blueprint service name + PORT (Render private DNS).

services:
  - type: web
    name: xray-api
    runtime: docker
    plan: starter
    region: singapore
    repo: https://github.com/JAYATIAHUJA/X-Ray-hydraDB-Hack
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "10000"
      - key: XRAY_SNAPSHOT_DIR
        value: /app/data/snapshots/kafka-2025q2
      - key: XRAY_READ_ONLY
        value: "true"

  - type: web
    name: xray-web
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/JAYATIAHUJA/X-Ray-hydraDB-Hack
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "10000"
      # Private DNS: http://<api-service-name>:<api-PORT>
      # Requires API on starter+ (free web cannot receive private inbound).
      - key: API_UPSTREAM
        value: http://xray-api:10000

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API is same-origin: the SPA calls /api/... and nginx forwards to the API service.
    # Variable + resolver so HTTPS upstreams (e.g. Render free tier) resolve at request time.
    resolver 8.8.8.8 ipv6=off valid=30s;
    set $xray_api_upstream "${API_UPSTREAM}";
    location /api/ {
        proxy_pass $xray_api_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Hashed assets can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA routes (/, /app) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

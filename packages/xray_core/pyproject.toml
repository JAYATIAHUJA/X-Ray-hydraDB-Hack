[project]
name = "xray-core"
version = "0.1.0"
description = "Shared contracts for the X-Ray evidence platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_core"]

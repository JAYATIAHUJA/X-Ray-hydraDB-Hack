[project]
name = "xray-hydra"
version = "0.1.0"
description = "Safe HydraDB integration for X-Ray"
requires-python = ">=3.13,<3.14"
dependencies = [
    "neo4j>=5.28.0",
    "polars>=1.27.1",
    "xray-core",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_hydra"]

[project]
name = "xray-ingest"
version = "0.1.0"
description = "Deterministic evidence ingestion for X-Ray"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.23.0",
    "polars>=1.24.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "xray-core",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_ingest"]

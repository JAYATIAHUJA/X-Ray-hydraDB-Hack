[project]
name = "xray-runtime"
version = "0.1.0"
description = "Validated runtime lifecycle management for X-Ray"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.10.0",
    "xray-core",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_runtime"]

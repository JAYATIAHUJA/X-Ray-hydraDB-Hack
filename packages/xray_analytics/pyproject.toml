[project]
name = "xray-analytics"
version = "0.1.0"
description = "Ghost, Faultline, and Gap analytics for X-Ray"
requires-python = ">=3.13,<3.14"
dependencies = [
    "networkx>=3.4.0",
    "xray-core",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_analytics"]
